<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ТОЧКА ТОРГОВЛИ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f5f7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 24px;
      padding: 35px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 18px;
      outline: none;
    }

    input:focus {
      border-color: #222;
    }

    button {
      width: 100%;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.99);
    }
  </style>
</head>

<body>

  <div class="login">

    <div class="logo">
      ТОЧКА ТОРГОВЛИ
    </div>

    <div class="subtitle">
      Вход в систему
    </div>

    <form>

      <label for="name">Имя</label>
      <input
        id="name"
        type="text"
        placeholder="Введите имя"
        required
      >

      <label for="phone">Номер телефона</label>
      <input
        id="phone"
        type="tel"
        placeholder="+7 700 000 00 00"
        required
      >

      <label for="password">Пароль</label>
      <input
        id="password"
        type="password"
        placeholder="Введите пароль"
        required
      >

      <button type="submit">
        ВОЙТИ
      </button>

    </form>

  </div>

</body>
</html>
